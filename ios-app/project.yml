name: DataBridge
options:
  bundleIdPrefix: com.yesnoi
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
targets:
  DataBridge:
    type: application
    platform: iOS
    sources:
      - path: DataBridge
    info:
      path: DataBridge/Info.plist
      properties:
        CFBundleDisplayName: 三端互通
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: 保存接收的图片和视频到相册
        NSPhotoLibraryUsageDescription: 保存接收的图片和视频到相册
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
schemes:
  DataBridge:
    build:
      targets:
        DataBridge: all
    run:
      config: Release
    archive:
      config: Release
