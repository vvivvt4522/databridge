services:
  databridge:
    image: node:20-alpine
    container_name: databridge
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./web:/app/web
      - ./package.json:/app/package.json
      - ./node_modules:/app/node_modules
    ports:
      - "8322:8322"
    restart: unless-stopped
    command: sh -c "npm install --registry=https://registry.npmmirror.com --omit=dev --no-audit --no-fund && node server/index.js"
