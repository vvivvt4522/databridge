name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: ios-app
        run: |
          xcodebuild -project DataBridge.xcodeproj -scheme DataBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DataBridge.app Payload/
          zip -qry DataBridge-unsigned.ipa Payload
          ls -lh DataBridge-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataBridge-unsigned-ipa
          path: ios-app/DataBridge-unsigned.ipa
