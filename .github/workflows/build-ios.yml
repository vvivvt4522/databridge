name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen 2.43.0（固定旧版：新版本生成的工程格式 Xcode 15.4 读不了）
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/bin" >> $GITHUB_PATH
          /tmp/xcodegen/bin/xcodegen version

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: ios-app
        run: |
          xcodebuild -project DataBridge.xcodeproj -scheme DataBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DataBridge.app Payload/
          zip -qry DataBridge-unsigned.ipa Payload
          ls -lh DataBridge-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataBridge-unsigned-ipa
          path: ios-app/DataBridge-unsigned.ipa
